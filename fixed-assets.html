<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>固定資産管理</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #242039;
      --muted: #615c73;
      --line: #e6e2ee;
      --paper: #fff;
      --back: #f8f7fb;
      --blue: #2d4bdb;
      font: 15px/1.55 "Yu Gothic UI", "Hiragino Sans", Meiryo, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: var(--ink); background: var(--back); }
    h1, h2, p { margin: 0; }
    .wrap { width: min(1220px, calc(100% - 48px)); margin-inline: auto; }
    header { background: var(--paper); border-bottom: 1px solid var(--line); }
    .top { min-height: 71px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { font-weight: 800; letter-spacing: .025em; }
    .btn { display: inline-block; border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; color: var(--ink); background: var(--paper); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .btn:hover { background: #f1edf8; }
    .primary { background: var(--blue); color: white; border-color: var(--blue); }
    .primary:hover { background: #203cbe; }
    .btn:disabled { cursor: wait; opacity: .65; }
    :focus-visible { outline: 3px solid #795ed6; outline-offset: 3px; }
    main { padding-block: 30px 48px; }
    .hero { display: flex; align-items: end; justify-content: space-between; gap: 18px; padding: 30px 36px; background: #202e57; color: white; border-radius: 20px; }
    h1 { font-size: clamp(27px, 5vw, 43px); line-height: 1.2; }
    .hero p { margin-top: 8px; color: #e1e7f6; }
    .hero time { font-size: .9rem; color: #e1e7f6; }
    .panel { margin-top: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
    .login { max-width: 540px; margin: 16px auto; padding: 24px; }
    .login h1 { font-size: 27px; margin-bottom: 9px; }
    .login p, .muted { color: var(--muted); }
    .login .btn { margin-top: 14px; }
    .panel-top { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding: 18px 20px; flex-wrap: wrap; }
    h2 { font-size: 20px; }
    .filters { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: .84rem; }
    input, select { padding: 8px 10px; border: 1px solid #cec8dd; border-radius: 8px; color: var(--ink); background: white; font: inherit; min-height: 37px; }
    .message { padding: 0 20px 12px; color: var(--muted); }
    .message.error { color: #a42e42; }
    .table-scroll { overflow: auto; border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; }
    table { border-collapse: collapse; width: 100%; min-width: 1080px; font-size: .91rem; }
    th, td { padding: 11px 13px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    thead { background: #f4f3f8; }
    thead th { white-space: nowrap; }
    tbody tr:last-child > * { border-bottom: none; }
    tbody tr:hover { background: #fbfaff; }
    tbody th { min-width: 135px; }
    .number, .date { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .number { text-align: right; }
    .notes { min-width: 145px; max-width: 260px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 6px; color: #434064; background: #edebf6; white-space: nowrap; }
    .tag[data-status="使用中"] { color: #145b3c; background: #e5f4eb; }
    .tag[data-status="保管中"] { color: #775010; background: #fff1d0; }
    .attachment { display: block; max-width: 150px; color: #2947be; overflow-wrap: anywhere; }
    .empty { padding: 25px 20px; color: var(--muted); }
    @media (max-width: 640px) {
      .wrap { width: calc(100% - 24px); }
      main { padding-block: 16px 24px; }
      .hero { align-items: start; flex-direction: column; padding: 22px; }
      .panel-top { padding: 14px; }
      .message { padding-inline: 14px; }
    }
  </style>
</head>
<body>
  <header><div class="wrap top"><span class="brand">MY PORTAL</span><a class="btn" href="./index.html">ポータルに戻る</a></div></header>
  <main class="wrap">
    <section class="panel login" id="login" aria-labelledby="login-title">
      <h1 id="login-title">固定資産管理</h1>
      <p id="login-message" role="status">ポータルのログイン状態を確認しています…</p>
      <a class="btn" href="./index.html">マイポータルを開く</a>
    </section>

    <div id="app" hidden>
      <section class="hero" aria-labelledby="page-title">
        <div><h1 id="page-title">固定資産管理</h1><p id="source-label">Airtableの固定資産一覧</p></div>
        <div>
          <button class="btn primary" id="load" type="button">データ読み込み</button>
          <p><time id="synced">未同期</time></p>
        </div>
      </section>
      <section class="panel" aria-labelledby="table-title">
        <div class="panel-top">
          <div><h2 id="table-title">固定資産一覧</h2><p id="count" class="muted">0件</p></div>
          <div class="filters">
            <label>検索<input id="search" type="search" placeholder="名称・詳細" autocomplete="off"></label>
            <label>種別<select id="category"><option value="">すべて</option></select></label>
            <label>使用状況<select id="status"><option value="">すべて</option></select></label>
          </div>
        </div>
        <p class="message" id="message" role="status" hidden></p>
        <p class="empty" id="empty">「データ読み込み」でAirtableの一覧を取得できます。</p>
        <div class="table-scroll" id="table" tabindex="0" role="region" aria-labelledby="table-title" hidden>
          <table aria-labelledby="table-title">
            <thead><tr><th scope="col">名称</th><th scope="col">種別</th><th scope="col">使用状況</th><th scope="col">購入日</th><th scope="col" class="number">購入価格</th><th scope="col">処分方式</th><th scope="col">処分日</th><th scope="col" class="number">売却価格</th><th scope="col">詳細</th><th scope="col">画像</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="./config.js"></script>
  <script src="./vendor/supabase.js"></script>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const preview = new URLSearchParams(location.search).get("preview") === "1";
    const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY" });
    const dateTime = new Intl.DateTimeFormat("ja-JP", { dateStyle: "medium", timeStyle: "short" });
    const examples = [
      { name: "ノートパソコン（見本）", category: "パソコン・ノートパソコン", status: "使用中", purchasedOn: "2025-04-12", purchasePrice: 148000, notes: "自宅用" },
      { name: "ミラーレスカメラ（見本）", category: "カメラ・レンズ", status: "保管中", purchasedOn: "2024-09-03", purchasePrice: 89000 },
      { name: "旧モニター（見本）", category: "PC周辺機器", status: "処分済", purchasedOn: "2021-06-18", purchasePrice: 27500, disposalMethod: "売却", disposedOn: "2025-10-20", salePrice: 8000 },
    ];
    let client;
    let owner = null;
    let sessionGeneration = 0;
    let snapshot = null;

    function report(text, error = false) {
      $("message").textContent = text;
      $("message").hidden = !text;
      $("message").classList.toggle("error", error);
    }

    function syncOptions(id, values) {
      const select = $(id);
      const selected = select.value;
      select.replaceChildren(new Option("すべて", ""));
      for (const value of [...new Set(values.filter(Boolean))].sort((a,b) => a.localeCompare(b, "ja"))) {
        select.add(new Option(value, value));
      }
      select.value = [...select.options].some((option) => option.value === selected) ? selected : "";
    }

    function cell(row, value, className = "", heading = false) {
      const element = document.createElement(heading ? "th" : "td");
      if (heading) element.scope = "row";
      element.className = className;
      element.textContent = value ?? "—";
      row.append(element);
      return element;
    }

    function attachmentLinks(target, images) {
      for (const image of images ?? []) {
        let url;
        try { url = new URL(image.url); } catch { continue; }
        const host = url.hostname;
        if (url.protocol !== "https:" || !(host === "dl.airtable.com" || host === "airtableusercontent.com" || host.endsWith(".airtableusercontent.com"))) continue;
        const link = document.createElement("a");
        link.className = "attachment";
        link.href = url.href;
        link.rel = "noopener noreferrer";
        link.target = "_blank";
        link.textContent = image.filename || "画像を開く";
        if (!target.querySelector("a")) target.replaceChildren();
        target.append(link);
      }
    }

    function render() {
      const assets = snapshot?.assets ?? [];
      const query = $("search").value.trim().normalize("NFKC").toLocaleLowerCase("ja");
      const category = $("category").value;
      const status = $("status").value;
      const visible = assets.filter((asset) => {
        const searchable = [asset.name, asset.notes].join(" ").normalize("NFKC").toLocaleLowerCase("ja");
        return (!category || asset.category === category) && (!status || asset.status === status) && searchable.includes(query);
      });
      const rows = document.createDocumentFragment();
      for (const asset of visible) {
        const row = document.createElement("tr");
        cell(row, asset.name, "", true);
        cell(row, asset.category);
        const statusCell = cell(row, asset.status);
        if (asset.status) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.dataset.status = asset.status;
          tag.textContent = asset.status;
          statusCell.replaceChildren(tag);
        }
        cell(row, asset.purchasedOn, "date");
        cell(row, Number.isFinite(asset.purchasePrice) ? yen.format(asset.purchasePrice) : null, "number");
        cell(row, asset.disposalMethod);
        cell(row, asset.disposedOn, "date");
        cell(row, Number.isFinite(asset.salePrice) ? yen.format(asset.salePrice) : null, "number");
        cell(row, asset.notes, "notes");
        attachmentLinks(cell(row, null), asset.images);
        rows.append(row);
      }
      $("rows").replaceChildren(rows);
      $("count").textContent = `${visible.length}件 / 全${assets.length}件`;
      $("table").hidden = visible.length === 0;
      $("empty").hidden = visible.length !== 0;
      $("empty").textContent = assets.length ? "条件に一致する資産がありません。" : snapshot
        ? "固定資産一覧にデータがありません。" : "「データ読み込み」でAirtableの一覧を取得できます。";
    }

    function useSnapshot(data) {
      snapshot = data;
      const assets = snapshot?.assets ?? [];
      syncOptions("category", assets.map((asset) => asset.category));
      syncOptions("status", assets.map((asset) => asset.status));
      const timestamp = data?.synced_at;
      if (timestamp) $("synced").dateTime = timestamp;
      else $("synced").removeAttribute("datetime");
      $("synced").textContent = timestamp ? "最終読み込み " + dateTime.format(new Date(timestamp)) : "未同期";
      render();
    }

    function setButton(busy) {
      $("load").disabled = busy;
      $("load").textContent = busy ? "読み込み中…" : "データ読み込み";
    }

    async function applySession(session) {
      const next = session?.user?.id ?? null;
      const generation = ++sessionGeneration;
      owner = next;
      $("login").hidden = Boolean(next);
      $("app").hidden = !next;
      $("login-message").textContent = "マイポータルでログインしてから、固定資産管理を開いてください。";
      report("");
      $("search").value = "";
      useSnapshot(null);
      setButton(Boolean(next));
      if (!next) return;

      try {
        const { data, error } = await client.from("fixed_asset_snapshots")
          .select("assets,synced_at").eq("owner_id", next).maybeSingle();
        if (generation !== sessionGeneration) return;
        if (error) throw error;
        useSnapshot(data);
      } catch {
        if (generation === sessionGeneration) report("保存済みの一覧を取得できませんでした。Supabaseの設定を確認してください。", true);
      } finally {
        if (generation === sessionGeneration) setButton(false);
      }
    }

    async function refresh() {
      if ($("load").disabled) return;
      if (preview) {
        useSnapshot({ assets: examples, synced_at: new Date().toISOString() });
        report("見本データを読み込みました。");
        return;
      }
      if (!owner) return;

      const generation = sessionGeneration;
      setButton(true);
      report("Airtableから最新データを取得しています…");
      const messages = {
        setup: "同期機能のSupabase設定が完了していません。",
        login: "ログインの有効期限が切れました。ポータルでログインし直してください。",
        owner: "このアカウントには固定資産の同期権限がありません。",
        airtable: "Airtableから取得できませんでした。同期設定やAirtable側の権限を確認してください。",
        storage: "Supabaseに保存できませんでした。固定資産テーブルの設定を確認してください。",
      };
      try {
        const { data, error } = await client.functions.invoke("sync-fixed-assets", { method: "POST" });
        if (generation !== sessionGeneration) return;
        if (error) {
          const details = await error.context?.json?.().catch(() => null);
          throw new Error(messages[details?.code] || "データを読み込めませんでした。同期機能のデプロイと接続を確認してください。");
        }
        if (!Array.isArray(data?.assets) || !data.synced_at) throw new Error("同期結果を読み取れませんでした。");
        useSnapshot(data);
        report(`${data.assets.length}件を読み込みました。`);
      } catch (error) {
        if (generation === sessionGeneration) report(error.message || "データの読み込みに失敗しました。", true);
      } finally {
        if (generation === sessionGeneration) setButton(false);
      }
    }

    $("load").addEventListener("click", refresh);
    $("search").addEventListener("input", render);
    $("category").addEventListener("change", render);
    $("status").addEventListener("change", render);

    if (preview) {
      $("login").hidden = true;
      $("app").hidden = false;
      $("source-label").textContent = "プレビュー · 見本データ";
      useSnapshot({ assets: examples, synced_at: null });
    } else {
      const config = window.PORTAL_CONNECTION;
      if (!config?.url || !config?.publishableKey || !window.supabase?.createClient) {
        $("login-message").textContent = "ポータルのSupabase接続設定を読み込めませんでした。";
      } else {
        try {
          client = window.supabase.createClient(config.url, config.publishableKey, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
          });
          client.auth.onAuthStateChange((event, session) => {
            setTimeout(() => {
              if (event === "INITIAL_SESSION" || (session?.user?.id ?? null) !== owner) {
                void applySession(session);
              }
            }, 0);
          });
        } catch {
          $("login-message").textContent = "ポータルのSupabase接続設定を確認してください。";
        }
      }
    }
  </script>
</body>
</html>
