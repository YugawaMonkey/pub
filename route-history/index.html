<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルートヒストリー｜年別の地図と旅の記録</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#18313d;background:#f3f6f7}body{display:flex;flex-direction:column}header{flex:none;padding:14px 24px;background:#152f3b;color:#fff;border-bottom:1px solid #365360;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:19px;margin:0;letter-spacing:.05em}.subtitle{margin:2px 0 0;font-size:12px;color:#c3d5dc}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}label{font-size:14px;font-weight:600}select,button,a.action{font:inherit;font-size:14px;min-height:40px;border:1px solid #bdd0d7;border-radius:6px;padding:8px 12px;background:#fff;color:#193442}select{min-width:130px}button,a.action{cursor:pointer}a.action{text-decoration:none;display:inline-flex;align-items:center}button:hover,a.action:hover{background:#e3f1f2}:focus-visible{outline:3px solid #78b8ff;outline-offset:3px}.next{font-size:12px;color:#c3d5dc}.viewer{flex:1;min-height:0;position:relative}iframe{border:0;width:100%;height:100%;display:block;background:#f3f6f7}.status{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 15px;background:#fff;color:#193442;border:1px solid #bdd0d7;border-radius:6px;z-index:1;box-shadow:0 2px 10px #0002}.status[hidden]{display:none}.error{padding:24px;color:#8b2727}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:680px){header{padding:12px;gap:10px}.brand{width:100%}.controls{gap:7px}select,button,a.action{font-size:13px;padding:7px 9px}.next{width:100%}.subtitle{display:none}}@media print{body{height:auto}header{color:#18313d;background:white}.viewer{height:900px}.controls{display:none}}
</style>
</head>
<body>
<header>
 <div class="brand"><h1>ルートヒストリー</h1><p class="subtitle">大阪での日常と、旅先の記録</p></div>
 <nav class="controls" aria-label="年別の記録">
  <label for="year">表示年</label><select id="year" aria-label="表示年"></select>
  <button id="annual" type="button">年間地図に戻る</button>
  <a class="action" id="standalone" target="_blank" rel="noopener">別タブで開く</a>
  <span class="next" id="planned"></span>
 </nav>
</header>
<main class="viewer" aria-label="選択した年のルートヒストリー">
 <div class="status" id="loading" role="status" hidden>記録を読み込んでいます…</div>
 <iframe id="viewer" title="年別ルート地図・統計" aria-label="年別ルート地図・統計"></iframe>
 <p class="error" id="error" role="alert" hidden></p>
 <noscript><p class="error">地図の表示にはJavaScriptが必要です。</p></noscript>
</main>
<script src="years.js"></script>
<script>
(()=>{
 const entries=window.ROUTE_HISTORY_YEARS||[];
 const ready=entries.filter(e=>e.status==='ready'&&e.page).sort((a,b)=>b.year-a.year);
 const select=document.getElementById('year'),frame=document.getElementById('viewer'),loading=document.getElementById('loading');
 let current=null;
 if(!ready.length){const error=document.getElementById('error');error.textContent='表示できる年の記録がありません。years.jsと年別ページをご確認ください。';error.hidden=false;frame.hidden=true;return;}
 for(const entry of [...entries].sort((a,b)=>b.year-a.year)){
   const option=document.createElement('option');option.value=entry.year;option.textContent=entry.year+'年'+(entry.status==='ready'?'':'（追加予定）');option.disabled=entry.status!=='ready'||!entry.page;select.append(option);
 }
 document.getElementById('planned').textContent=entries.filter(e=>e.status!=='ready').sort((a,b)=>a.year-b.year).map(e=>e.year+'年は追加予定').join(' · ');
 function show(year){
   const entry=ready.find(e=>String(e.year)===String(year))||ready[0];current=entry;select.value=entry.year;
   loading.hidden=false;frame.title=entry.year+'年の移動ルート・旅行・統計';frame.src=entry.page;
   document.getElementById('standalone').href=entry.page;document.title=entry.year+'年｜ルートヒストリー';
   try{sessionStorage.setItem('route-history-year',String(entry.year));}catch{}
   const hash='#year='+entry.year;if(location.hash!==hash)location.hash=hash;
 }
 frame.addEventListener('load',()=>{loading.hidden=true;});
 select.addEventListener('change',()=>show(select.value));
 document.getElementById('annual').addEventListener('click',()=>show(current.year));
 window.addEventListener('hashchange',()=>{const year=new URLSearchParams(location.hash.slice(1)).get('year');if(String(current?.year)!==year)show(year);});
 let saved;try{saved=sessionStorage.getItem('route-history-year');}catch{}
 show(new URLSearchParams(location.hash.slice(1)).get('year')||saved||ready[0].year);
})();
</script>
</body>
</html>
