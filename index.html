<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="description" content="公開ページへのリンクをまとめた、手動で編集できるポータル。">
<title>マイポータル</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232d4bdb'/%3E%3Cpath d='M11 11h7v7h-7zm11 0h7v7h-7zm-11 11h7v7h-7zm11 0h7v7h-7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="header-inner"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>MY PORTAL</div><span id="sync" class="sync" role="status">接続を確認しています</span><div class="header-actions"><button id="edit" type="button" hidden>管理画面</button><button id="logout" type="button" hidden>ログアウト</button></div></div></header>
<section id="auth-panel" class="auth-panel"><h1>マイポータル</h1><p>登録済みのアカウントでログインしてください。</p><form id="login-form"><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">パスワード</label><input id="password" type="password" required autocomplete="current-password"></div><button id="login" type="submit" class="primary">ログイン</button></form><p id="auth-message" role="status"></p></section><main id="portal" hidden>
<p id="status" role="status" hidden></p>
<section class="hero" aria-labelledby="page-title"><div><p class="eyebrow">YOUR PERSONAL COLLECTION</p><h1 id="page-title">マイポータル</h1><p id="subtitle">必要なページへ、ここから。</p></div><div class="collection-mark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="18" height="18" rx="4"/><rect x="37" y="9" width="18" height="18" rx="4"/><rect x="9" y="37" width="18" height="18" rx="4"/><path d="M37 46h18m-9-9v18"/></svg></div></section>
<section aria-labelledby="links-title"><div class="list-top"><div class="list-label"><h2 id="links-title">ページ一覧</h2><span class="count" id="count">4</span></div><label class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">ページを検索</span><input id="search" type="search" placeholder="ページを検索" autocomplete="off"></label></div><div id="cards" class="cards"></div><p id="empty" class="empty" hidden>該当するページがありません。<br>検索語を変更してください。</p></section>
<aside class="help"><p>設定はSupabaseに保存されます。編集後に「保存して反映」を押すと、他の端末にも反映されます。</p></aside>
<footer><span>MY PORTAL / PERSONAL COLLECTION</span><span>ひとつの入口から、それぞれのページへ。</span></footer>
</main>

<noscript><p style="padding:24px">リンクの表示・編集にはJavaScriptを有効にしてください。</p></noscript>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
